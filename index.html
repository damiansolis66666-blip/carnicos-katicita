<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Katicita ❤️</title>
    <style>
        body{ margin:0; font-family:Arial, Helvetica, sans-serif; background:linear-gradient(135deg,#ff9a9e,#fad0c4); display:flex; justify-content:center; align-items:center; min-height:100vh; color:white; } 
        .tarjeta{ background:rgba(255,255,255,0.15); backdrop-filter:blur(10px); padding:40px; border-radius:20px; text-align:center; max-width:700px; box-shadow:0 10px 30px rgba(0,0,0,.3); } 
        h1{ font-size:3em; } 
        .corazon{ font-size:70px; animation:latido 1s infinite; } 
        @keyframes latido{ 0%{transform:scale(1);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="corazon">❤️</div>
        <h1>Para Katicita</h1>
    </div>
</body>
</html>
